# X / Twitter 去广告 - Quantumult X Rewrite
# 更新时间：2026-04-26
# 用途：过滤 X 时间线、搜索、详情页中的 promoted/广告条目。
# 导入类型：Rewrite / 重写

[rewrite_local]
# Home / Timeline / Search / Tweet detail / GraphQL timeline APIs
^https?:\/\/(api\.x\.com|api\.twitter\.com|api-[a-zA-Z0-9_-]+\.twitter\.com)\/(1\.1|2|graphql)\/.*(HomeTimeline|home_timeline|SearchTimeline|search_adaptive|TweetDetail|UserTweets|UserTweetsAndReplies|ListLatestTweetsTimeline|Bookmarks|timeline|guide|adaptive).*$ url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/x-qx-adblock.js

[mitm]
hostname = api.x.com, api.twitter.com, api-*.twitter.com
