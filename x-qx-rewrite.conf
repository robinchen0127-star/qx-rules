# X / Twitter 去广告 - Quantumult X Rewrite（安全回滚版）
# 更新时间：2026-04-26
# 说明：上一版 script-response-body 会导致“帖子无法正常载入”，已临时禁用响应体改写。
# 当前只保留空 rewrite 段和 MITM 声明；真正拦截先使用 x-qx-filter.list。
# 如果 X 仍无法载入：先停用/删除旧的 x-qx-rewrite.conf 资源，更新资源并重启 X。

[rewrite_local]
# 暂无启用规则，避免破坏 X 时间线 JSON。

[mitm]
hostname = api.x.com, api.twitter.com, api-*.twitter.com
