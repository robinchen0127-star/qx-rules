# Quantumult X - 京东开屏广告拦截 Rewrite
# 更新时间：2026-07-08
# 导入类型：重写 / Rewrite
# 注意：api.m.jd.com 是核心 API，不做域名级 reject，只对明确广告函数/路径清理响应。

[rewrite_local]
# 京东 App 开屏/启动图/广告配置接口
^https?:\/\/api\.m\.jd\.com\/(?:client\.action|api)\?.*(?:functionId|functionid)=(?:start|startup|launch|splash|welcome|advert|advertise|ad|getStart|startInfo|querySplash|appOpen|boot|coldStart|hotStart|startUpAdvert|queryStartUp|queryOpenScreen|openScreen|querySplashAdvert|startPage|startupPage|startupConfig|jdDelivery|deliverLayer|queryMaterialAdverts|queryAdvert|advertiseMaterial).*$ url script-response-body https://cdn.jsdelivr.net/gh/robinchen0127-star/qx-rules@main/jd-qx-adblock-v2.js
^https?:\/\/api\.m\.jd\.com\/(?:client\.action|api)\?.*(?:splash|startup|startUp|launch|openScreen|open_screen|advert|advertise|adverts|adMaterial|materialAd|开屏).*$ url script-response-body https://cdn.jsdelivr.net/gh/robinchen0127-star/qx-rules@main/jd-qx-adblock-v2.js
^https?:\/\/(?:bdsp|blackhole|janapi|uranus|mercury|orbit|gia)\.m\.jd\.com\/.*(?:splash|startup|launch|openScreen|open_screen|advert|ad|material|expo|delivery|promotion).* url script-response-body https://cdn.jsdelivr.net/gh/robinchen0127-star/qx-rules@main/jd-qx-adblock-v2.js

# 明确广告域名接口直接拒绝
^https?:\/\/(?:xlog|uranus|policy|blackhole)\.m\.jd\.com\/.*(?:ad|advert|expo|log|splash|startup|launch).* url reject-dict

[mitm]
hostname = api.m.jd.com, bdsp.m.jd.com, blackhole.m.jd.com, janapi.m.jd.com, uranus.m.jd.com, mercury.m.jd.com, orbit.m.jd.com, gia.m.jd.com, xlog.m.jd.com, policy.jd.com
