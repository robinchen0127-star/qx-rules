[rewrite_local]
# 直播吧 App 开屏 / 弹窗 / 信息流广告接口强拦截
^https?:\/\/[^\/]*zhibo8[^\/]*\/.*(splash|startup|launch|open_screen|openscreen|start_ad|launch_ad|splash_ad|boot_ad|welcome).* url reject-dict
^https?:\/\/[^\/]*zhibo8[^\/]*\/.*(popup|pop_up|popwindow|dialog|modal|float|floating|window_ad|alert_ad|interstitial).* url reject-dict
^https?:\/\/[^\/]*zhibo8[^\/]*\/.*(banner|advert|advertise|advertisement|ad_list|ads_list|feed_ad|native_ad|list_ad|news_ad|recommend_ad|app_ad|insert_ad).* url reject-dict
^https?:\/\/[^\/]*zhibo8[^\/]*\/.*(promotion|promote|activity_popup|activity_ad|event_ad|market|marketing|commercial).* url reject-dict

# 有些接口用 gg / adv / material / config 下发广告配置
^https?:\/\/[^\/]*zhibo8[^\/]*\/.*(\/gg\/|\/adv\/|\/ad\/|\/ads\/|adver|material|adconfig|ad_config).* url reject-dict

# 统计上报，辅助压制广告画像；若正文异常，先注释这一条
^https?:\/\/[^\/]*zhibo8[^\/]*\/.*(track|trace|report|collect|analytics|behavior|event_log|applog).* url reject-200

[mitm]
hostname = *.zhibo8.cc, *.zhibo8.com, *.zhibo8.net, *.zhibo8.cn
