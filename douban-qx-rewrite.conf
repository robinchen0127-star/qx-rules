# Quantumult X - 豆瓣开屏广告拦截 Rewrite
# 更新时间：2026-05-04
# 用途：拒绝豆瓣 App 开屏广告配置/投放接口
# 导入类型：重写 / Rewrite

[rewrite_local]
# 豆瓣开屏/广告配置接口，拒绝响应以跳过开屏广告
^https?:\/\/erebor\.douban(?:io)?\.com\/.* url reject-dict
^https?:\/\/ad\.doubanio\.com\/.* url reject-dict
^https?:\/\/(?:frodo|adservice)\.douban\.com\/.*(?:ad|advert|splash|launch|boot|startup|promote|promo|commercial).* url reject-dict
^https?:\/\/api\.douban\.com\/.*(?:ad|advert|splash|launch|boot|startup|promote|promo|commercial).* url reject-dict
^https?:\/\/frodo\.douban\.com\/api\/v\d+\/.*(?:ad|advert|splash|launch|boot|startup).* url reject-dict

[mitm]
hostname = erebor.douban.com, erebor.doubanio.com, ad.doubanio.com, frodo.douban.com, adservice.douban.com, api.douban.com
