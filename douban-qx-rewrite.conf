# Quantumult X - 豆瓣开屏广告拦截 Rewrite
# 更新时间：2026-05-04
# 用途：清理/拒绝豆瓣 App 开屏广告配置与投放接口
# 导入类型：重写 / Rewrite

[rewrite_local]
# 豆瓣开屏广告竞价接口：不要 reject，改为空广告响应，避免 App 走缓存/兜底广告
^https?:\/\/api\.douban\.com\/v\d+\/app_ads\/splash_bid.* url script-response-body https://cdn.jsdelivr.net/gh/robinchen0127-star/qx-rules@main/douban-qx-adblock.js
^https?:\/\/api\.douban\.com\/.*(?:app_ads|splash|startup|launch|boot).* url script-response-body https://cdn.jsdelivr.net/gh/robinchen0127-star/qx-rules@main/douban-qx-adblock.js

# 其它明确广告域名/接口直接拒绝
^https?:\/\/erebor\.douban(?:io)?\.com\/.* url reject-dict
^https?:\/\/ad\.doubanio\.com\/.* url reject-dict
^https?:\/\/(?:frodo|adservice)\.douban\.com\/.*(?:ad|advert|splash|launch|boot|startup|promote|promo|commercial).* url reject-dict
^https?:\/\/frodo\.douban\.com\/api\/v\d+\/.*(?:ad|advert|splash|launch|boot|startup).* url reject-dict

[mitm]
hostname = api.douban.com, erebor.douban.com, erebor.doubanio.com, ad.doubanio.com, frodo.douban.com, adservice.douban.com
