# Quantumult X - App 广告拦截 Rewrite v2（豆瓣 / 京东 / 闲鱼）
# 更新时间：2026-06-02
# 用途：清理豆瓣、京东、闲鱼等 App 开屏广告接口与广告配置响应
# 导入类型：重写 / Rewrite

[rewrite_local]
# 豆瓣开屏广告接口：返回空广告 JSON，避免 reject 后走缓存/兜底广告
^https?:\/\/api\.douban\.com\/v\d+\/app_ads\/(?:splash_bid|splash_preload|splash_statistics|splash).* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/douban-qx-adblock-v2.js
^https?:\/\/api\.douban\.com\/.*(?:app_ads|splash|startup|launch|boot).* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/douban-qx-adblock-v2.js

# 其它明确广告域名/接口直接拒绝
^https?:\/\/erebor\.douban(?:io)?\.com\/.* url reject-dict
^https?:\/\/ad\.doubanio\.com\/.* url reject-dict
^https?:\/\/(?:frodo|adservice)\.douban\.com\/.*(?:ad|advert|splash|launch|boot|startup|promote|promo|commercial).* url reject-dict
^https?:\/\/frodo\.douban\.com\/api\/v\d+\/.*(?:ad|advert|splash|launch|boot|startup).* url reject-dict


# 京东 App 开屏/启动图/广告配置接口
# 注意：api.m.jd.com 是核心 API，不做域名级 reject，只对明确广告函数/路径清理响应。
^https?:\/\/api\.m\.jd\.com\/(?:client\.action|api)\?.*(?:functionId|functionid)=(?:start|startup|launch|splash|welcome|advert|advertise|ad|getStart|startInfo|querySplash|appOpen|boot).*$ url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/jd-qx-adblock-v2.js
^https?:\/\/api\.m\.jd\.com\/(?:client\.action|api)\?.*(?:splash|startup|launch|advert|ad|开屏).*$ url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/jd-qx-adblock-v2.js
^https?:\/\/(?:bdsp|blackhole|janapi|uranus|mercury|orbit|gia)\.m\.jd\.com\/.*(?:splash|startup|launch|advert|ad|material|expo).* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/jd-qx-adblock-v2.js

# 京东明确广告域名接口直接拒绝
^https?:\/\/(?:xlog|uranus|policy|blackhole)\.m\.jd\.com\/.*(?:ad|advert|expo|log).* url reject-dict


# 闲鱼常见启动/开屏/弹层广告接口：清理响应体
# 注意：不域名级拦截 acs.m.taobao.com / h5api.m.taobao.com，只对广告/开屏路径做响应清理。
^https?:\/\/(?:acs|h5api)\.m\.taobao\.com\/(?:gw\/)?mtop\.(?:idle|fleamarket|taobao|alimama|alibaba)\.[^?]*(?:splash|startup|launch|advert|ad|poplayer)[^?]*.* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/xianyu-qx-adblock-v2.js
^https?:\/\/(?:acs|h5api)\.m\.taobao\.com\/(?:gw\/)?mtop\.[^?]*(?:idle\.home\.welcome|idle\.main\.start|idle\.marketing|idle\.advert|idle\.splash|idle\.poplayer|fleamarket\.advert|fleamarket\.splash)[^?]*.* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/xianyu-qx-adblock-v2.js
^https?:\/\/guide-acs\.m\.taobao\.com\/gw\/mtop\.[^?]*(?:splash|startup|launch|advert|ad|poplayer)[^?]*.* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/xianyu-qx-adblock-v2.js

# 阿里系广告/弹层配置接口：只清响应，避免 reject 触发本地缓存兜底
^https?:\/\/(?:amdc|adashx|umdc|hydra|fourier)\.m\.taobao\.com\/.*(?:splash|startup|launch|advert|ad|poplayer).* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/xianyu-qx-adblock-v2.js

[mitm]
hostname = api.douban.com, erebor.douban.com, erebor.doubanio.com, ad.doubanio.com, frodo.douban.com, adservice.douban.com, api.m.jd.com, bdsp.m.jd.com, blackhole.m.jd.com, janapi.m.jd.com, uranus.m.jd.com, mercury.m.jd.com, orbit.m.jd.com, gia.m.jd.com, xlog.m.jd.com, policy.jd.com, acs.m.taobao.com, h5api.m.taobao.com, guide-acs.m.taobao.com, amdc.m.taobao.com, adashx.m.taobao.com, umdc.m.taobao.com, hydra.m.taobao.com, fourier.m.taobao.com
