# Quantumult X - 豆瓣开屏广告拦截 Rewrite v2
# 更新时间：2026-06-02
# 用途：清理豆瓣 App 开屏广告接口，覆盖 splash_bid / splash_preload / splash_statistics
# 导入类型：重写 / Rewrite

[rewrite_local]
# 豆瓣开屏广告接口：返回空广告 JSON，避免 reject 后走缓存/兜底广告
^https?:\/\/api\.douban\.com\/v\d+\/app_ads\/(splash_bid|splash_preload|splash_statistics|splash).* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/douban-qx-adblock-v2.js
^https?:\/\/api\.douban\.com\/.*(app_ads|splash|startup|launch|boot).* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/douban-qx-adblock-v2.js

# 其它明确广告域名/接口直接拒绝
^https?:\/\/ad\.doubanio\.com\/.* url reject-dict


# 豆瓣冷启动日志命中的火山 / 穿山甲广告 SDK 请求
^https?:\/\/webcast-open\.douyin\.com\/webcast\/openapi\/pangle.* url reject-dict
^https?:\/\/vod-license-m\.volccdn\.com\/vod-license\/.* url reject-dict
^https?:\/\/apmplus\.volces\.com\/monitor\/collect\/c\/session.* url reject-dict


# 豆瓣冷启动第二批日志命中：豆瓣监测 / 阿里 UT 上传
^https?:\/\/h-adashx4bc\.ut\.taobao\.com\/upload.* url reject-dict

[mitm]
hostname = api.douban.com, ad.doubanio.com, webcast-open.douyin.com, vod-license-m.volccdn.com, apmplus.volces.com, h-adashx4bc.ut.taobao.com
