# Quantumult X - 豆瓣开屏广告拦截 Rewrite v2
# 更新时间：2026-06-02
# 导入类型：重写 / Rewrite
# 注意：api.douban.com 是核心 API，只清明确广告路径，不做域名级 REJECT。

[rewrite_local]
# 开屏广告统计上报接口：直接拒绝返回空 200（活动日志已确认该接口）
^https?:\/\/api\.douban\.com\/v\d+\/app_ads\/splash_statistics.* url reject-200

# 开屏广告竞价 / 拉取接口：返回空广告结构，避免 reject 后 App 走缓存/兜底广告
^https?:\/\/api\.douban\.com\/v\d+\/app_ads\/splash_bid.* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/douban-qx-adblock-v3.js
^https?:\/\/api\.douban\.com\/.*(?:app_ads|splash|startup|launch|boot).* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/douban-qx-adblock-v3.js
^https?:\/\/(?:frodo|adservice)\.douban\.com\/.*(?:app_ads|ad|advert|splash|launch|boot|startup|promote|promo|commercial).* url script-response-body https://raw.githubusercontent.com/robinchen0127-star/qx-rules/main/douban-qx-adblock-v3.js

# 非核心广告域名直接拒绝
^https?:\/\/erebor\.douban(?:io)?\.com\/.* url reject-dict
^https?:\/\/ad\.doubanio\.com\/.* url reject-dict

[mitm]
hostname = api.douban.com, erebor.douban.com, erebor.doubanio.com, ad.doubanio.com, frodo.douban.com, adservice.douban.com
