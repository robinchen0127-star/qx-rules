# Quantumult X - 东方甄选去广告 Rewrite
# 更新时间：2026-06-05
# 导入类型：Rewrite / 重写
# 说明：拦截东方甄选开屏、首页浮层、签到/领券弹窗、会员提醒和广告监测接口。
# 注意：必须开启 MITM 并信任证书；不要域名级拦截 capi.eastbuy.com。

[rewrite_local]
# 埋点 / 性能监测
^https?:\/\/tracking\.eastbuy\.com\/sa.* url reject-200
^https?:\/\/wkdcm\d*\.tingyun\.com\/.* url reject-200

# 字节系 / 穿山甲广告
^https?:\/\/.*\/api\/ad\/union\/sdk\/get_ads.* url reject-dict
^https?:\/\/.*\/union\/service\/.*splash.* url reject-dict
^https?:\/\/.*\.snssdk\.com\/.*(?:splash|open_ad|launch_ad|boot).* url reject-dict
^https?:\/\/webcast-open\.douyin\.com\/webcast\/openapi\/pangle.* url reject-dict

# 东方甄选自营开屏 / 首页浮层 / 运营位弹窗
^https?:\/\/capi\.eastbuy\.com\/c\/homepage\/homepageFloat.* url reject-dict
^https?:\/\/capi\.eastbuy\.com\/c\/app\/position\/remind\/openMember.* url reject-dict
^https?:\/\/capi\.eastbuy\.com\/c\/app\/position\/.*(?:splash|popup|pop|ad|advert|coupon|member|remind).* url reject-dict
^https?:\/\/capi\.eastbuy\.com\/.*(?:splash|startup|launch|open_screen|openscreen|popup|pop_up|adPosition|advert|couponPopup).* url reject-dict

[mitm]
hostname = capi.eastbuy.com, h5.eastbuy.com, s1.eastbuy.com, json.eastbuy.com, tracking.eastbuy.com, wkdcm*.tingyun.com, is.snssdk.com, webcast-open.douyin.com
