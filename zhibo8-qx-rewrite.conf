# 直播吧 App 去广告 - Quantumult X 重写规则
# 类型：Rewrite。必须开启 MitM 并信任证书。更新：2026-04-25

[rewrite_local]
# 直播吧广告配置/开屏/弹窗/信息流
^https?:\/\/pca\.zhibo8\.(cc|com)\/sdkAdvert\.php.* url reject-dict
^https?:\/\/[^\/]*zhibo8\.(cc|com|net|cn)\/.*sdkAdvert.* url reject-dict
^https?:\/\/[^\/]*zhibo8\.(cc|com|net|cn)\/.*(splash|startup|launch|open_screen|openscreen|start_ad|launch_ad|splash_ad|boot_ad|welcome).* url reject-dict
^https?:\/\/[^\/]*zhibo8\.(cc|com|net|cn)\/.*(popup|pop_up|popwindow|dialog|modal|float|floating|window_ad|alert_ad|interstitial).* url reject-dict
^https?:\/\/[^\/]*zhibo8\.(cc|com|net|cn)\/.*(banner|advert|advertise|advertisement|ad_list|ads_list|feed_ad|native_ad|list_ad|news_ad|recommend_ad|app_ad|insert_ad).* url reject-dict
^https?:\/\/[^\/]*zhibo8\.(cc|com|net|cn)\/.*(promotion|promote|activity_popup|activity_ad|event_ad|market|marketing|commercial).* url reject-dict
^https?:\/\/[^\/]*zhibo8\.(cc|com|net|cn)\/.*(\/gg\/|\/adv\/|\/ad\/|\/ads\/|adver|material|adconfig|ad_config).* url reject-dict

# 广告 SDK 常见请求
^https?:\/\/.*\.(pangolin-sdk-toutiao|pglstatp-toutiao|pglstatp-snssdk|csjplatform)\.com\/.* url reject-dict
^https?:\/\/.*\.(gdt|e)\.qq\.com\/.* url reject-dict
^https?:\/\/.*\.gdtimg\.com\/.* url reject-dict
^https?:\/\/.*\.(mobads|pos|union)\.baidu\.com\/.* url reject-dict

# 统计上报，减少广告画像
^https?:\/\/[^\/]*zhibo8\.(cc|com|net|cn)\/.*(track|trace|report|collect|analytics|behavior|event_log|applog).* url reject-200

[mitm]
hostname = pca.zhibo8.cc, pca.zhibo8.com, *.zhibo8.cc, *.zhibo8.com, *.zhibo8.net, *.zhibo8.cn
